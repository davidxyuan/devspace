name: CI

on:
  push:
    branches:
      - main
      - codex/tray-release-readiness-20261018
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Pi sandbox dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup candidate-preparation bootstrap Python
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Windows Watchdog regression suite
        if: matrix.os == 'windows-latest'
        run: npm run test:windows-watchdog

      - name: Candidate preparation boundaries
        if: matrix.os == 'windows-latest'
        run: python -I -B scripts/windows/prepare-hermes-pm-candidate.test.py

      - name: Start the built CLI in isolated state
        run: node scripts/windows/stack-runtime-smoke.cjs

      - name: Doctor
        run: node dist/cli.js doctor
