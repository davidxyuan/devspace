name: Prepare Hermes runtime candidate with Windows compatibility patch
on:
  push:
    branches:
      - codex/tray-release-readiness-20261018
    paths:
      - .github/workflows/tray-hermes-candidate.yml
      - scripts/windows/prepare-hermes-pm-candidate*.py
      - scripts/windows/stack-release-manifest.json
      - scripts/windows/stack-hermes-source.py
      - scripts/windows/stack-hermes-mcp-smoke.py
      - scripts/windows/watchdog-hermes-pair.test.ps1
      - scripts/windows/watchdog-control-core.ps1
      - scripts/windows/stack-operation.ps1
      - scripts/windows/hermes-gateway-supervisor*.py
      - scripts/windows/hermes-gateway-real.test.py
      - scripts/windows/hermes-gateway-readiness.test.py
      - scripts/windows/hermes-gateway-profile.test.py
      - scripts/windows/hermes-gateway-pair.test.py
      - scripts/windows/patches/hermes-windows-control-pipe.patch
  workflow_dispatch:
    inputs:
      agent_revision:
        description: Full official Agent commit; apply reviewed Windows patch, stop on conflict, never deploy
        required: true
        type: string
      verify_scheduled_launcher:
        description: Verify the official Windows launcher's stop and scheduled retry behavior
        type: boolean
        default: false
      candidate_gpt_revision:
        description: Optional full Hermes GPT fork commit for the candidate only. Restore tests use the manifest baseline.
        required: false
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Push validation stays on the reviewed official baseline; newer revisions require explicit dispatch.
      AGENT_REVISION: ${{ inputs.agent_revision || 'd923a5eb487a17c0a68801bba9ef0f56c81040a8' }}
      BASELINE_REVISION: 297552a9d646119871391d202509822cd86330df
      LAUNCHER_REVISION: bc3398ee9d1c490e417e401fbadc68e2d6556e23
      CANDIDATE_GPT_REVISION: ${{ inputs.candidate_gpt_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preparation and failure boundaries
        shell: pwsh
        run: |
          python -I -B scripts/windows/prepare-hermes-pm-candidate.test.py
          if ($LASTEXITCODE) { throw 'Preparation boundary tests failed' }
          python -I -B scripts/windows/hermes-gateway-readiness.test.py
          if ($LASTEXITCODE) { throw 'Gateway readiness tests failed' }
          python -I -B scripts/windows/hermes-gateway-pair.test.py
          if ($LASTEXITCODE) { throw 'Prepared pair checks failed' }
      - name: Fetch two immutable official releases and paired GPT source
        shell: pwsh
        run: |
          if ($env:AGENT_REVISION -cnotmatch '^[0-9a-f]{40}$') { throw 'Full commit SHA required' }
          if ($env:CANDIDATE_GPT_REVISION -and $env:CANDIDATE_GPT_REVISION -cnotmatch '^[0-9a-f]{40}$') { throw 'Full GPT commit SHA required' }
          if ($env:AGENT_REVISION -ceq $env:BASELINE_REVISION) { throw 'Upgrade requires two distinct revisions' }
          foreach ($pin in @(@{Name='baseline'; Revision=$env:BASELINE_REVISION}, @{Name='candidate'; Revision=$env:AGENT_REVISION})) {
            $source = Join-Path $env:RUNNER_TEMP "hermes-$($pin.Name)-source"
            git init $source
            if ($LASTEXITCODE) { throw 'Source initialization failed' }
            # Match the isolated preparer's checkout bytes, independent of runner Git settings.
            git -C $source config core.autocrlf false
            if ($LASTEXITCODE) { throw 'Checkout line-ending configuration failed' }
            git -C $source remote add origin https://github.com/NousResearch/hermes-agent.git
            if ($LASTEXITCODE) { throw 'Origin setup failed' }
            git -C $source fetch --no-tags --depth=1 origin $pin.Revision
            if ($LASTEXITCODE) { throw 'Pinned fetch failed' }
            git -C $source checkout --detach $pin.Revision
            if ($LASTEXITCODE) { throw 'Pinned checkout failed' }
          }
          $gpt = (Get-Content scripts/windows/stack-release-manifest.json -Raw | ConvertFrom-Json).components.'hermes-gpt'
          if ($gpt.repository -cne 'davidxyuan/hermes-gpt' -or $gpt.revision -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid GPT release pin' }
          $gptSource = Join-Path $env:RUNNER_TEMP 'hermes-gpt-source'
          git init $gptSource
          if ($LASTEXITCODE) { throw 'GPT initialization failed' }
          git -C $gptSource config core.autocrlf false
          if ($LASTEXITCODE) { throw 'GPT line-ending configuration failed' }
          git -C $gptSource remote add origin "https://github.com/$($gpt.repository).git"
          if ($LASTEXITCODE) { throw 'GPT origin setup failed' }
          git -C $gptSource fetch --no-tags --depth=1 origin $gpt.revision
          if ($LASTEXITCODE) { throw 'GPT pinned fetch failed' }
          git -C $gptSource checkout --detach $gpt.revision
          if ($LASTEXITCODE) { throw 'GPT pinned checkout failed' }
      - name: Prepare frozen Agent and rebuild paired GPT dependencies
        shell: pwsh
        env:
          VERIFY_LAUNCHER: ${{ inputs.verify_scheduled_launcher }}
        run: |
          $gpt = (Get-Content scripts/windows/stack-release-manifest.json -Raw | ConvertFrom-Json).components.'hermes-gpt'
          foreach ($pin in @(@{Name='baseline'; Revision=$env:BASELINE_REVISION}, @{Name='candidate'; Revision=$env:AGENT_REVISION})) {
            $source = Join-Path $env:RUNNER_TEMP "hermes-$($pin.Name)-source"
            $patch = (Resolve-Path scripts/windows/patches/hermes-windows-control-pipe.patch).Path
            $gptSource = Join-Path $env:RUNNER_TEMP 'hermes-gpt-source'
            $gptRevision = $gpt.revision
            if ($pin.Name -eq 'candidate' -and $env:CANDIDATE_GPT_REVISION) {
              $gptRevision = $env:CANDIDATE_GPT_REVISION
              git -C $gptSource fetch --no-tags --depth=1 origin $gptRevision
              if ($LASTEXITCODE) { throw 'Candidate GPT fetch failed' }
              git -C $gptSource checkout --detach $gptRevision
              if ($LASTEXITCODE) { throw 'Candidate GPT checkout failed' }
            }
            if ($pin.Name -eq 'candidate' -and $env:VERIFY_LAUNCHER -eq 'true') {
              git -C $source fetch --no-tags --depth=2 https://github.com/davidxyuan/hermes-agent.git $env:LAUNCHER_REVISION
              if ($LASTEXITCODE) { throw 'Launcher fix fetch failed' }
              $parent = git -C $source rev-parse "$env:LAUNCHER_REVISION^"
              if ($LASTEXITCODE -or $parent -cne $pin.Revision) { throw 'Launcher fix has a different upstream base' }
              $delta = Join-Path $env:RUNNER_TEMP 'launcher.patch'
              git -C $source diff --binary "--output=$delta" $parent $env:LAUNCHER_REVISION --
              if ($LASTEXITCODE) { throw 'Cannot extract the pinned launcher fix' }
              $combined = Join-Path $env:RUNNER_TEMP 'candidate-windows.patch'
              [IO.File]::WriteAllBytes($combined, [byte[]]([IO.File]::ReadAllBytes($patch) + [IO.File]::ReadAllBytes($delta)))
              $patch = $combined
            }
            python -I -B scripts/windows/prepare-hermes-pm-candidate.py --source $source --revision $pin.Revision --patch $patch --gpt-source $gptSource --gpt-revision $gptRevision --out "$env:RUNNER_TEMP/hermes-pm-$($pin.Name)"
            if ($LASTEXITCODE) { throw "$($pin.Name) preparation failed; preserved diagnostics below" }
          }
      - name: Verify bounded external gateway supervision with real test processes
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/hermes-pm-candidate/runtime/Scripts/python.exe" -I -B scripts/windows/hermes-gateway-supervisor.test.py -v *> "$env:RUNNER_TEMP/hermes-pm-candidate/supervisor-tests.log"
          if ($LASTEXITCODE) { throw 'Supervisor tests failed' }
          & "$env:RUNNER_TEMP/hermes-pm-candidate/runtime/Scripts/python.exe" -I -B scripts/windows/hermes-gateway-profile.test.py -v *> "$env:RUNNER_TEMP/hermes-pm-candidate/profile-tests.log"
          if ($LASTEXITCODE) { throw 'Profile exchange tests failed' }
      - name: Verify real version switch, crash recovery and restored baseline after failed startup
        shell: pwsh
        run: |
          $prepared = Join-Path $env:RUNNER_TEMP 'hermes-pm-candidate'
          $baseline = Join-Path $env:RUNNER_TEMP 'hermes-pm-baseline'
          $python = Join-Path $prepared 'runtime/Scripts/python.exe'
          $profile = Join-Path $env:RUNNER_TEMP 'hermes-gateway-disposable-profile'
          & "$baseline/runtime/Scripts/python.exe" -I -B scripts/windows/hermes-gateway-supervisor.py init --prepared $baseline --home $profile
          if ($LASTEXITCODE) { throw 'Gateway test profile initialization failed' }
          & $python -I -B scripts/windows/hermes-gateway-real.test.py --prepared $prepared --baseline $baseline --home $profile --report "$prepared/gateway-real.json" *> "$prepared/gateway-real.log"
          if ($LASTEXITCODE) { throw 'Real gateway lifecycle test failed; inspect preserved evidence' }
      - name: Verify official launcher exit codes and scheduled crash recovery
        if: inputs.verify_scheduled_launcher
        shell: pwsh
        run: ./.github/tests/hermes-launcher.ps1
      - name: Preserve evidence (not an installable release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-preparation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hermes-pm-baseline/*.json
            ${{ runner.temp }}/hermes-pm-baseline/*.log
            ${{ runner.temp }}/hermes-pm-baseline/pair-*.txt
            ${{ runner.temp }}/hermes-pm-baseline/candidate.patch
            ${{ runner.temp }}/hermes-pm-candidate/*.json
            ${{ runner.temp }}/hermes-pm-candidate/*.log
            ${{ runner.temp }}/hermes-pm-candidate/pair-*.txt
            ${{ runner.temp }}/hermes-pm-candidate/candidate.patch
            ${{ runner.temp }}/hermes-gateway-disposable-profile/supervised-gateway.log
          if-no-files-found: warn
